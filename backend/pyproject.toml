[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-booking-backend"
version = "0.1.0"
description = "FastAPI backend for an event booking system"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "fastapi>=0.110",
    "PyJWT>=2.8,<3",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]